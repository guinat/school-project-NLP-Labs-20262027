[project]
name = "sentiment-mlp"
version = "0.1.0"
description = "Sentiment analysis on Allocine reviews with a multilayer perceptron."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
